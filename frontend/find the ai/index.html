<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find the AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <div class="top-bar">
            <div>
                <h1>Find the AI</h1>
                <p>Talk to the characters and find the AI.</p>
            </div>

            <div class="info">
                <span id="score">Score: 0</span>
                <span id="lives">Lives: 3</span>
            </div>
        </div>

        <div id="game-area">

            <div class="npc" id="npc1">
                <div class="npc-body"></div>
                <span>Alex</span>
            </div>

            <div class="npc" id="npc2">
                <div class="npc-body"></div>
                <span>Sam</span>
            </div>

            <div class="npc" id="npc3">
                <div class="npc-body"></div>
                <span>Jordan</span>
            </div>

            <div class="npc" id="npc4">
                <div class="npc-body"></div>
                <span>Taylor</span>
            </div>

            <div class="npc" id="npc5">
                <div class="npc-body"></div>
                <span>Riley</span>
            </div>

            <div id="gate">
                <div class="gate-door"></div>
                <span>EXIT</span>
            </div>

            <div id="player"></div>

        </div>

        <div id="message">
            Move around and get close to a character.
        </div>

        <div id="interaction" class="hidden">

            <div class="interaction-box">

                <h2 id="character-name">Character</h2>

                <p id="character-text">
                    Character message goes here.
                </p>

                <p class="question">
                    Is this character AI or Human?
                </p>

                <div class="guess-buttons">
                    <button id="ai-button">AI</button>
                    <button id="human-button">Human</button>
                </div>

            </div>

        </div>

        <div id="result" class="hidden">

            <div class="result-box">

                <h2 id="result-title">Game Over</h2>

                <p id="result-text"></p>

                <button id="restart-button">Play Again</button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
