<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>AI or Human</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="game">

            <h1>AI or Human</h1>
            <p class="subtitle">Can you tell who made it?</p>

            <div class="score">
                Score: <span id="score">0</span>
            </div>

            <div class="round">
                Round: <span id="round">1</span>
            </div>

            <div class="image-box">
                <img id="gameImage" src="" alt="Image to guess">
            </div>

            <div class="buttons">
                <button id="aiBtn">AI</button>
                <button id="humanBtn">Human</button>
            </div>

            <p id="result"></p>

            <button id="nextBtn">Next</button>

        </div>

        <script src="script.js"></script>

    </body>
</html>
